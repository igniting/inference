[book]
authors = ["The Inference Systems contributors"]
language = "en"
src = "src"
title = "Inference Systems"

[build]
build-dir = "book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/igniting/inference"
edit-url-template = "https://github.com/igniting/inference/edit/main/{path}"
site-url = "/inference/"
additional-css = ["theme/inference.css"]
additional-js = ["theme/mermaid-init.js"]
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true

[output.html.search]
enable = true
